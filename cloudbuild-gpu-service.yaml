steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'gpu_service/Dockerfile'
      - '-t'
      - 'gcr.io/$PROJECT_ID/vertigo-gpu-service:latest'
      - '-t'
      - 'gcr.io/$PROJECT_ID/vertigo-gpu-service:$SHORT_SHA'
      - '.'
    id: 'build-image'

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/vertigo-gpu-service:latest'
    id: 'push-latest'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/vertigo-gpu-service:$SHORT_SHA'
    id: 'push-tagged'

images:
  - 'gcr.io/$PROJECT_ID/vertigo-gpu-service:latest'
  - 'gcr.io/$PROJECT_ID/vertigo-gpu-service:$SHORT_SHA'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'

